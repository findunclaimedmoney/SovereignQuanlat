name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
     - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - name: Install dependencies & build
        working-directory: ./frontend
        run: |
          yarn install --frozen-lockfile
          yarn build
        env:
          CI: true
          REACT_APP_BACKEND_URL: https://sovereignquant.com.au
